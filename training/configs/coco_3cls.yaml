# COCO 3-class debug experiment — person / car / bicycle only
# v2: Fixed cls loss normalization (normalize by num_boxes, not B*Q)
# The old normalization diluted classifier signal 25x, collapsing all predictions to class 0.
#
# Data: coco_mini images (val2017), filtered to 3 classes
# Train: python train.py --config configs/coco_3cls.yaml --data_path data/coco_mini --device cuda

model:
  img_size: 416
  in_channels: 3
  base_channels: 16
  embed_dim: 64
  num_heads: 2
  encoder_type: none
  num_encoder_layers: 0
  window_size: 8
  num_decoder_layers: 6
  num_queries: 50
  num_classes: 3
  dropout: 0.0
  aux_loss: true

training:
  epochs: 150
  batch_size: 128
  grad_accumulate: 1             # effective batch = 128
  optimizer: adamw
  lr: 1.0e-4
  lr_backbone: 1.0e-5
  weight_decay: 1.0e-4
  lr_scheduler: cosine
  warmup_epochs: 5
  ema: true
  ema_decay: 0.9999
  amp: true
  clip_grad_norm: 0.1

loss:
  cls_weight: 2.0
  bbox_weight: 5.0
  giou_weight: 2.0
  focal_alpha: 0.25
  focal_gamma: 2.0
  no_obj_weight: 0.5              # weight for the "no-object" (∅) channel
  matcher_cls_weight: 2.0
  matcher_bbox_weight: 5.0
  matcher_giou_weight: 2.0

data:
  train_ann: annotations_3cls/instances_train2017.json
  val_ann: annotations_3cls/instances_val2017.json
  train_img_dir: images/train2017
  val_img_dir: images/val2017
  num_workers: 8
  prefetch_factor: 4
  persistent_workers: true
  pin_memory: true

logging:
  project: coco_3cls_v3
  save_dir: runs/
  save_period: 15
  val_period: 10
